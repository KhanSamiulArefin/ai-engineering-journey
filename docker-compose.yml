services:
  api:
    build: .
    container_name: customer-api
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:password@db:5432/customerdb
      MODEL_PATH: /app/models/churn_model.pkl

  db:
    image: postgres:15
    container_name: customer-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: customerdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d customerdb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: